<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>รายงาน ส.เจริญโฮมสแควร์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap">
<style>
:root{--bg:#f4f5f6;--paper:#fff;--ink:#1c2228;--muted:#5d6873;--line:#d5dadf;--accent:#b88a1c}
@media (prefers-color-scheme: dark){:root{--bg:#14181c;--paper:#1c2227;--ink:#e6eaee;--muted:#9aa6b1;--line:#323b43;--accent:#e0b44a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 64px}
h1{font-family:"Bai Jamjuree",sans-serif;font-size:32px;margin:0 0 4px}
p{margin:0;color:var(--muted)}
ul{list-style:none;padding:0;margin:32px 0 0;border-top:2px solid var(--ink)}
li{border-bottom:1px solid var(--line)}
a{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 4px;color:inherit;text-decoration:none}
a:hover .t,a:focus-visible .t{color:var(--accent)}
.d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:2px}
.t{font-family:"Bai Jamjuree",sans-serif;font-weight:600;font-size:18px;display:block}
.s{font-size:14px;color:var(--muted)}
@media (max-width:480px){a{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>รายงาน ส.เจริญโฮมสแควร์</h1>
  <p>รวมรายงานและบทวิเคราะห์ของร้าน เรียงจากใหม่ไปเก่า</p>
  <ul>
    <!-- รายงานใหม่ใส่ไว้บนสุด -->
    <li><a href="reports/2026-11-07-missing-items/"><span class="d">7 พ.ย. 2569</span><span><span class="t">ของที่ลูกค้าถามหน้าร้านแล้วไม่มี</span><span class="s">42 รายการ ช่วง 12 ต.ค. ถึง 6 พ.ย. 2569 พร้อม 5 อันดับที่ควรสั่งและกลุ่มลูกค้า</span></span></a></li>
  </ul>
</div>
</body>
</html>
